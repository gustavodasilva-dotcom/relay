services:
  postgres:
    image: postgres:18
    container_name: PostgreSQL
    environment:
      - POSTGRES_DB=relay
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
