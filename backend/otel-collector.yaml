receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> endpoint scraped by Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs -> Loki native OTLP endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheus

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/loki
